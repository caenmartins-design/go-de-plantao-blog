name: Newsletter Semanal

# Gatilho semanal (schedule) DESATIVADO em 2026-08-17: a curadoria por IA depende de
# ANTHROPIC_API_KEY (secret deste repo), que está inválida/sem créditos — o workflow
# falhava toda segunda no passo "Rodar pipeline da newsletter" (exit code 1). A
# publicação semanal passou a ser feita por automação local via Claude Code
# (ver ~/Library/LaunchAgents/br.com.godeplantao.newsletter.plist). Mantido
# workflow_dispatch para permitir disparo manual caso necessário.
on:
  workflow_dispatch: {}   # permite disparar manualmente em Actions → Newsletter Semanal → Run workflow

permissions:
  contents: write

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          # Pausa pontual pedida para não rodar em 2026-08-03 (só afeta o disparo
          # automático de segunda; workflow_dispatch manual continua funcionando).
          # Pode remover este job depois dessa data.
          hoje=$(TZ='America/Sao_Paulo' date +%Y-%m-%d)
          if [ "$hoje" = "2026-08-03" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  newsletter:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restaurar estado (artigos já vistos, para não duplicar semana a semana)
        uses: actions/cache@v4
        with:
          path: newsletter/dados
          key: newsletter-dados-${{ github.run_id }}
          restore-keys: |
            newsletter-dados-

      - name: Instalar dependências
        run: pip install -r newsletter/requirements.txt

      - name: Rodar pipeline da newsletter (buscar → curar → gerar → publicar no blog → enviar e-mail)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_NOME_REMETENTE: ${{ secrets.EMAIL_NOME_REMETENTE }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          EMAIL_ASSUNTO: ${{ secrets.EMAIL_ASSUNTO }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
        run: |
          git config --global user.name "Go de Plantão Bot"
          git config --global user.email "bot@godeplantao.com"
          python newsletter/main.py tudo
